<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
</head>
<body>
    <style>
        button{
            border: none;
            border-radius: 50px;
            background-color: skyblue;
            color: darkred;
            margin: 2%;
            padding: 2%;
        }
    </style>
    <Button onclick="
        console.log(`cartQuantity : ${CartQuantity}`)
    ">show quantity</Button>

    <button onclick="
        CartQuantity = CartQuantity + 1;
        console.log(`cartQuantity : ${CartQuantity}`)
    ">Add to card</button>

    <button onclick="
        CartQuantity = CartQuantity + 2;
        console.log(`cartQuantity : ${CartQuantity}`)
    ">+2</button>

    <button onclick="
        CartQuantity = CartQuantity + 3;
        console.log(`cartQuantity : ${CartQuantity}`)
    ">+3</button>
    
    <button onclick="
        CartQuantity = 0;
        console.log(`cartQuantity : ${CartQuantity}`)
    ">Reset Cart</button>
    
    <script>
        let CartQuantity = 0;
    </script>


</body>
</html>
